<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto">
  <tr>
    <td style="padding:40px 24px 0">
      <table width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e6e6e6">
        <tr>
          <td style="background:#000000;padding:24px 28px;text-align:center">
            <table cellpadding="0" cellspacing="0" style="margin:0 auto">
              <tr>
                <td style="width:38px;height:38px;background:#00c853;border-radius:8px;text-align:center;vertical-align:middle">
                  <span style="display:block;font-size:19px;font-weight:800;color:#000000;line-height:38px">5</span>
                </td>
                <td style="padding-left:10px;text-align:left">
                  <div style="font-size:17px;font-weight:800;color:#ffffff;letter-spacing:0.02em">{{bankName}}</div>
                  <div style="font-size:11px;color:#9e9e9e">Digital Bank</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background:#00c853;padding:2px 0"></td>
        </tr>
        <tr>
          <td style="padding:28px">
            <p style="margin:0 0 0 0;color:#171717;font-size:15px;line-height:1.5">Hi <strong>{{name}}</strong>,</p>
            <h1 style="margin:14px 0 8px;color:#000000;font-size:20px;font-weight:800;letter-spacing:-0.01em">Transaction {{type}}</h1>
            <p style="margin:0 0 20px;color:#171717;font-size:15px;line-height:1.5">A {{type}} of <strong style="color:#00c853;font-size:18px">{{amount}}</strong> has been completed on your account.</p>
            <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;border-radius:8px;margin:8px 0 24px">
              <tr>
                <td style="padding:16px 20px;color:#6b6b6b;font-size:13px">Current balance</td>
                <td style="padding:16px 20px;text-align:right;color:#000000;font-size:16px;font-weight:700" width="50%">{{balance}}</td>
              </tr>
            </table>
            <p style="margin:0;color:#6b6b6b;font-size:13px;line-height:1.5">If you didn't authorise this transaction, contact support immediately at <span style="color:#ff1744;font-weight:600">{{supportEmail}}</span>.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px;background:#000000;text-align:center;color:#9e9e9e;font-size:12px">
            &copy; 2026 {{bankName}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
