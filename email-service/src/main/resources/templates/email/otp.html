<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:40px auto;background:#ffffff;border-radius:8px;overflow:hidden">
<tr><td style="padding:32px 24px 16px;background:#1a73e8;text-align:center">
<h1 style="color:#ffffff;margin:0;font-size:20px">Password Reset OTP</h1>
</td></tr>
<tr><td style="padding:32px 24px">
<p style="margin:0 0 16px;color:#333;font-size:15px">Hi <strong>{{name}}</strong>,</p>
<p style="margin:0 0 16px;color:#333;font-size:15px">Use the OTP code below to reset your password. This code expires at <strong>{{expiresAt}}</strong>.</p>
<div style="text-align:center;margin:28px 0;padding:20px;background:#f8f9fa;border-radius:6px;letter-spacing:6px;font-size:32px;font-weight:bold;color:#1a73e8">{{otpCode}}</div>
<p style="margin:0 0 8px;color:#666;font-size:13px">If you didn't request this, please ignore this email. Your account is secure.</p>
</td></tr>
<tr><td style="padding:16px 24px;background:#f8f9fa;text-align:center;color:#999;font-size:12px">
&copy; Banking Platform
</td></tr>
</table>
</body>
</html>
