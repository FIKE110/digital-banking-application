<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>{{bankName}} — Receipt</title>
    <style type="text/css">
        body { font-family: Helvetica, Arial, sans-serif; color: #111111; margin: 0; padding: 32px; }
        .header { border-bottom: 3px solid #00c853; padding-bottom: 18px; margin-bottom: 26px; }
        .brand { font-size: 26px; font-weight: bold; color: #000000; }
        .brand span { color: #00c853; }
        .tagline { font-size: 11px; color: #777777; margin-top: 2px; }
        .title { font-size: 20px; font-weight: bold; margin-top: 6px; }
        .meta { font-size: 11px; color: #777777; }
        table.details { width: 100%; border-collapse: collapse; margin-top: 8px; }
        table.details td { padding: 10px 6px; font-size: 12px; border-bottom: 1px solid #eeeeee; }
        table.details td.label { color: #777777; width: 38%; }
        table.details td.value { font-weight: bold; text-align: right; }
        .total td { border-bottom: none !important; padding-top: 12px !important; font-size: 14px; }
        .status { display: inline-block; padding: 2px 10px; border-radius: 3px; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: bold; }
        .status.pending { background: #fff8e1; color: #b26a00; }
        .footer { margin-top: 32px; padding-top: 14px; border-top: 1px solid #eeeeee; font-size: 10px; color: #999999; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">{{bankName}}<span>.</span></div>
        <div class="tagline">{{bankTagline}}</div>
        <div class="title">{{receiptTitle}}</div>
    </div>

    <table class="details">
        <tr>
            <td class="label">Reference</td>
            <td class="value">{{reference}}</td>
        </tr>
        <tr>
            <td class="label">Date</td>
            <td class="value">{{date}}</td>
        </tr>
        <tr>
            <td class="label">Status</td>
            <td class="value"><span class="status {{statusClass}}">{{status}}</span></td>
        </tr>
        {{extraRows}}
        <tr class="total">
            <td class="label">Amount</td>
            <td class="value">{{amount}} {{currency}}</td>
        </tr>
    </table>

    <div class="footer">
        Generated by {{bankName}} · {{bankSupportEmail}} · {{bankWebsite}}<br/>
        This receipt was generated electronically and is valid without a signature.
    </div>

</body>
</html>
